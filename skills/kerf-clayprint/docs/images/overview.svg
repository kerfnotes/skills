<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="PingFang TC, 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif"><rect width="960" height="440" rx="20" fill="#1a1a19"/><circle cx="46" cy="46" r="16" fill="none" stroke="#d5b279" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="90.5 10.1" transform="rotate(-72.0 46 46)"/><text x="74" y="44" font-size="20" font-weight="700" fill="#e9eaec">Clayprint</text><text x="74" y="66" font-size="13" fill="#b5b6ad">文字稿進去，有判斷、附來源的簡報出來 · Script in, sourced deck out</text><line x1="24" y1="92" x2="936" y2="92" stroke="#b07a35" stroke-width="1.5"/><text x="24" y="126" font-size="15" font-weight="700" fill="#e9eaec">一趟流程<tspan dx="8" font-size="12" font-weight="400" fill="#b5b6ad">The pipeline</tspan></text><rect x="24.00" y="140" width="98.25" height="72" rx="12" fill="#252420" stroke="#3b3a35" stroke-width="1.2"/><text x="73.12" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#e9eaec">文字稿</text><text x="73.12" y="193" text-anchor="middle" font-size="12" fill="#b5b6ad">Script</text><path d="M128.25 170l6 6-6 6" fill="none" stroke="#b5b6ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="140.25" y="140" width="98.25" height="72" rx="12" fill="#252420" stroke="#3b3a35" stroke-width="1.2"/><text x="189.38" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#e9eaec">寫判斷</text><text x="189.38" y="193" text-anchor="middle" font-size="12" fill="#b5b6ad">Claims</text><path d="M244.50 170l6 6-6 6" fill="none" stroke="#b5b6ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="256.50" y="140" width="98.25" height="72" rx="12" fill="#252420" stroke="#3b3a35" stroke-width="1.2"/><text x="305.62" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#e9eaec">選版型</text><text x="305.62" y="193" text-anchor="middle" font-size="12" fill="#b5b6ad">Layouts</text><path d="M360.75 170l6
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 範例：疑慮對照（精簡圖，短答用）。說明見 concern-nutrition-label.md。 -->
<style>
.pm{font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground);line-height:1.5;display:flex;flex-direction:column;gap:16px}
.pm p{margin:0}
.pm h1{font-size:17px;line-height:1.4;margin:0;font-weight:700}
.pm .turn{border:2px solid var(--accent,#3b82f6);border-radius:var(--radius,8px);padding:10px 14px;font-size:14px}
.pm .turn b{color:var(--accent,#3b82f6)}
.pm .tag{display:inline-block;font-size:11px;line-height:1.3;padding:0 4px;border:1.5px solid;border-radius:4px;margin-left:4px;white-space:nowrap;vertical-align:1px;font-weight:600}
.pm .t-draft{border-color:var(--muted-foreground,currentColor)}
.pm .t-ask{border-color:var(--destructive,#ef4444)}
.pm .qa-h,.pm .qa-r{display:grid;grid-template-columns:2fr 3fr;gap:4px 12px;font-size:13px}
.pm .qa-h{font-size:12px;color:var(--muted-foreground);padding:0 10px}
.pm .qa-r{border-top:1px solid var(--border);padding:8px 10px}
.pm .qa-r .q{font-weight:700}
.pm .qa-r[data-focal]{border-top:0;border-radius:var(--radius,8px);box-shadow:inset 0 0 0 2px var(--accent,#3b82f6)}
@media (max-width:480px){.pm .qa-h{display:flex;gap:4px}.pm .qa-h span+span::before{content:"→ "}.pm .qa-r{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pm">
<h1>書豪的稿支柱都在，只缺「其他品項為何也改」</h1>
<p class="turn" data-focal><b>第一步：</b>補這句，今天回品保</p>
<div class="qa">
  <div class="qa-h"><span>品保心裡的問題</span><span>回答與依據</span></div>
  <div class="qa-r"><p class="q">改的根據？</p><p>主管機關對含糖飲料的新公告<span class="tag t-draft">稿內已有</span></p></div>
  <div class="qa-r"><p class="q">偷改配方？</p><p>配方、原料都沒變<span class="tag t-draft">稿內已有</span></p></div>
  <div class="qa-r" data-focal><p class="q">餅乾為何也改？</p><p>補：公司自選全系列同一版型<span class="tag t-ask">待問你</span></p></div>
  <div class="qa-r"><p class="q">數字怎麼對？</p><p>新舊基準各一行<span class="tag t-draft">稿內已有</span></p></div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 範例：利益交集（完整面板）。情境與解說見同名 .md。樣式取自 board-template.html 的零件，未另加。 -->
<style>
.pm{font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground);line-height:1.5;display:flex;flex-direction:column;gap:16px}
.pm p{margin:0}
.pm h1{font-size:17px;line-height:1.4;margin:0;font-weight:700}
.pm .turn{border:2px solid var(--accent,#3b82f6);border-radius:var(--radius,8px);padding:10px 14px;font-size:14px}
.pm .turn b{color:var(--accent,#3b82f6)}
.pm .basis{font-size:13px;color:var(--muted-foreground)}
.pm .basis b{color:var(--foreground)}
.pm svg{display:block;width:100%;max-width:440px;height:auto}
.pm svg text{font-size:13px;fill:currentColor}
.pm svg .mu{font-size:12px;fill:var(--muted-foreground,currentColor)}
.pm svg .nm{font-weight:700}
.pm svg .bx{fill:none;stroke:currentColor;stroke-width:1.5}
.pm svg [data-focal]{stroke:var(--accent,#3b82f6);stroke-width:2}
</style>
</head>
<body>
<div class="pm">
<h1>你有籌碼：立群不找你，就得等外包兩週</h1>
<p class="turn" data-focal><b>第一步：</b>今天回立群：開需求單、提案前兩天定稿，三場就排得進來</p>
<svg viewBox="0 0 360 384" role="img" aria-labelledby="vn-t vn-d">
<title id="vn-t">利益交集：你和立群都要三場提案拿下</title>
<desc id="vn-d">你在意不半夜改稿、支援算進考核；立群在意改稿有彈性、不用等外包，這兩項是推測。兩人都要三場提案拿下。談不成時，你可以照部門規定，沒開需求單就照本組排程走；立群只能找外包等兩週，或自己做而被客戶嫌粗糙。</desc>
<circle class="bx" cx="120" cy="148" r="108"/>
<circle class="bx" cx="240" cy="148" r="108"/>
<text class="nm" x="72" y="24" text-anchor="middle">你在意</text>
<text class="nm" x="288" y="24" text-anchor="middle">立群在意<tspan class="mu">〔推測〕</tspan></text>
<text x="72" y="136" text-anchor="middle">不半夜改稿</text>
<text x="72" y="160" text-anchor="middle">算進考核</text>
<text class="mu" x="180" y="118" text-anchor="middle">兩人都要</text>
<text class="nm" x="180" y="146" text-anchor="middle">三場提案</text>
<text class="nm" x="180" y="168" text-anchor="middle">要拿下</text>
<text x="288" y="136" text-anchor="middle">改稿有彈性</text>
<text x="288" y="160" text-anchor="middle">不等外包</text>
<text class="mu" x="12" y="292">談不成時各自能做的</text>
<text x="24" y="320">你：沒開需求單，就照本組排程走</text>
<rect class="bx" data-focal x="12" y="336" width="336" height="36" rx="6"/>
<text x="24" y="359">立群：外包要等兩週，自己做客戶嫌粗糙</text>
</svg>
<p class="basis"><b>依據：</b>《Getting to Yes》談判力來自談不成時的退路，不是職級；他的退路比你差，你就能開條件。</p>
</div>
</body>
</html>
